# Run locally with: cargo deny check advisories bans licenses sources --all-features
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check every feature, so optional dependencies are covered too.
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Unmaintained crates fail only when a workspace crate depends on them directly.
unmaintained = "workspace"
yanked = "deny"
# Vulnerabilities are always denied (implicit in version 2); list accepted
# advisories here with a reason.
ignore = [
    # zip's extraction API (`ZipArchive::extract`, `ZipStreamReader::extract`)
    # keeps SUID bits and follows symlinks out of the target. qry never
    # extracts an archive: rust_xlsxwriter only writes .xlsx files, and the
    # tests read entries by name in memory (calamine, `ZipArchive::by_name`).
    # zip 9.0 has the fix, but neither rust_xlsxwriter (^8.3) nor calamine
    # (^8.6) accepts it yet; drop these when they do.
    { id = "RUSTSEC-2026-0367", reason = "qry never extracts zip archives; no zip 9 release of rust_xlsxwriter/calamine yet" },
    { id = "RUSTSEC-2026-0368", reason = "qry never extracts zip archives; no zip 9 release of rust_xlsxwriter/calamine yet" },
    { id = "RUSTSEC-2026-0369", reason = "qry never extracts zip archives; no zip 9 release of rust_xlsxwriter/calamine yet" },
]

# ---------------------------------------------------------------------------
[licenses]
version = 2
# Only licenses compatible with MIT distribution of the binaries. MPL-2.0 is
# the one weak-copyleft exception. Anything not listed (GPL, LGPL, AGPL, SSPL,
# unlicensed, ...) is denied.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
]
confidence-threshold = 0.9
# Allowed-but-unused licenses are expected while the dependency set grows.
unused-allowed-license = "allow"
# Per-crate exceptions for licenses outside `allow`. Each needs a reason.
exceptions = [
    # Mozilla's CA certificate list as data, pulled in by oracledb's rustls
    # setup: a permissive data license with no obligations for the binary.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[licenses.private]
# The workspace crates are not published, which would otherwise be flagged.
ignore = true

# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
# Internal crates are path dependencies without a version (`workspace = true`),
# which cargo-deny reports as wildcards. crates.io itself rejects wildcard
# registry deps at publish time, so this check adds nothing for us.
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = [
    # TLS is rustls only. Checked for T001: with the current features neither
    # tokio-postgres (connects with NoTls) nor mysql_async (default features)
    # pulls in native-tls or OpenSSL on any target, and rustls is already in
    # the tree through oracledb. When Postgres or MySQL gain TLS, use their
    # rustls integrations (e.g. tokio-postgres-rustls, mysql_async's
    # `rustls-tls`) rather than lifting these bans. (keyring's macOS backend
    # uses Apple's security-framework, which is not OpenSSL.)
    { crate = "openssl", reason = "TLS is rustls only" },
    { crate = "openssl-sys", reason = "TLS is rustls only" },
    { crate = "native-tls", reason = "TLS is rustls only" },

    # Layering: these crates may only be pulled in directly by the listed
    # wrappers, which keeps the UI and CLI out of qry-core.
    { crate = "ratatui", wrappers = ["qry", "ratatui-textarea"], reason = "UI belongs to the qry crate only" },
    { crate = "crossterm", wrappers = ["qry", "ratatui", "ratatui-crossterm", "ratatui-textarea"], reason = "UI belongs to the qry crate only" },
    # criterion is the benchmarks' dev-dependency (T006); it never reaches a
    # build of qry-core itself.
    { crate = "clap", wrappers = ["qry", "clap_complete", "clap_mangen", "criterion"], reason = "CLI parsing belongs to the qry crate only" },
]

# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

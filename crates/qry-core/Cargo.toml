[package]
name = "qry-core"
description = "Domain logic for qry, independent of any user interface"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Compiles `qry_core::testing` (`FakeDatabase` and result builders) for other
# crates' tests. Never enabled in a release build.
test-util = []

# Keep this crate UI-agnostic: no ratatui, no crossterm, no clap.
# Everything here should be testable without a terminal.
[dependencies]
futures = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
color-eyre = { workspace = true }
hex = { workspace = true }
mysql_async = { workspace = true }
oracledb = { workspace = true }
rust_xlsxwriter = { workspace = true }
# Used to check a host name before TLS.
rustls-pki-types = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tokio-rusqlite = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
# A TLS server for the Oracle tests.
rustls = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
# `start_paused` and `time::advance` for tests on a virtual clock.
tokio = { workspace = true, features = ["test-util"] }
